<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>EasyDraw · DSE 数学绘图素材库</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="tb">
  <b class="logo">EasyDraw <small>数学</small></b>
  <button id="bNew" title="新建">新建</button>
  <button id="bOpen" title="打开 .json 工程">打开</button>
  <button id="bSave" title="保存工程 (Ctrl+S)">保存</button>
  <button id="bDemo" title="载入示例">示例</button>
  <button id="bImg" title="导入图片（也可以直接 Ctrl+V 粘贴截图，或把图片文件拖进画布）">导入图片</button>
  <i class="sep"></i>
  <button id="bUndo" title="撤销 (Ctrl+Z)">↶</button>
  <button id="bRedo" title="重做 (Ctrl+Y)">↷</button>
  <i class="sep"></i>
  <button id="bGrid" title="显示/隐藏网格">网格</button>
  <button id="bSnap" title="吸附网格（拖动时按 Alt 临时关闭）">吸附</button>
  <button id="bBW" title="黑白预览（模拟试卷打印效果）">黑白预览</button>
  <i class="sep"></i>
  <label class="tbsize" title="画布尺寸（也可拖动画布右下角）">画布 <input id="cvW" type="number" step="10"> × <input id="cvH" type="number" step="10"></label>
  <button id="bFit" title="把画布缩放到刚好包住所有对象">适应内容</button>
  <button id="bDoc" title="打开画布设置（或点击画布空白处）">画布设置</button>
  <i class="sep"></i>
  <button id="bZout">−</button><button id="zoomLbl" title="点击恢复 100%">100%</button><button id="bZin">+</button>
  <span class="grow"></span>
  <button id="bCopy" class="pri" title="复制为高清 PNG，可直接粘贴到 Word">复制 PNG</button>
  <button id="bPNG">导出 PNG</button>
  <button id="bSVG">导出 SVG</button>
  <input type="file" id="fileIn" accept=".json" hidden>
  <input type="file" id="imgIn" accept="image/*" multiple hidden>
</header>
<main>
  <aside id="left">
    <input id="search" type="search" placeholder="搜索素材…">
    <div id="palette"></div>
    <div id="ver"></div>
  </aside>
  <section id="wrap">
    <svg id="cv" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs>
        <pattern id="gMinor" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M10,0H0V10" fill="none" stroke="#e6ebf2" stroke-width="0.6"/></pattern>
        <pattern id="gMajor" patternUnits="userSpaceOnUse" width="50" height="50"><rect width="100%" height="100%" fill="url(#gMinor)"/><path d="M50,0H0V50" fill="none" stroke="#cdd6e2" stroke-width="0.8"/></pattern>
        <pattern id="checker" patternUnits="userSpaceOnUse" width="16" height="16"><rect width="16" height="16" fill="#fff"/><path d="M0,0h8v8H0zM8,8h8v8H8z" fill="#eee"/></pattern>
      </defs>
      <rect id="bgRect" x="0" y="0"/>
      <rect id="gridRect" x="0" y="0" fill="url(#gMajor)" pointer-events="none"/>
      <g id="scene"></g>
      <g id="overlay"></g>
    </svg>
  </section>
  <div id="splitter" title="拖动调整面板宽度"></div>
  <aside id="props"></aside>
</main>
<div id="toast"></div>

<template id="helpTpl">
  <details class="help" open>
    <summary>使用提示</summary>
    <ul>
      <li>左侧点击素材添加到画布中央，或直接拖入画布；蓝色圆点为控制点（可拖动顶点）。</li>
      <li><b>多选</b>：Ctrl/Shift 点击加选；空白处拖动框选；Ctrl+A 全选。<b>组合</b>：Ctrl+G，取消 Ctrl+Shift+G。<b>图层</b>：Ctrl+] / Ctrl+[。</li>
      <li><b>平面几何</b>：在「作图」框里一行一条，如 <code>A = 0, 100</code>、<code>M = mid A B</code>、<code>poly A B C</code>、<code>angle A B C x</code>、<code>tick A B 2</code>。输入框留空可看到全部指令说明。</li>
      <li><b>立体几何</b>：顶点自动标名；附加作图如 <code>seg A G</code>、<code>angle G A C \theta</code>、<code>poly P Q C A gray</code>（截面）。</li>
      <li><b>图表函数</b>：<code>2x+1</code>、<code>x^2</code>、<code>sin(x)</code>、<code>log(x)</code>(以10为底)、<code>ln(x)</code>、<code>2^x</code>；三角函数可选「按度」。不等式区域：<code>y &lt;= -x+5</code>。写错会显示红字。</li>
      <li>文字语法：<code>x_1</code> <code>x^2</code> <code>\frac{a}{b}</code> <code>\sqrt{x}</code> <code>\sin \theta</code> <code>\angle ABC</code> <code>\triangle</code> <code>\cong</code> <code>\sim</code> <code>\parallel</code> <code>\perp</code> <code>\cup</code> <code>\cap</code> <code>\le</code> <code>\ge</code> <code>\overline{AB}</code> <code>\Roman{3}</code></li>
      <li>旋转：选中框上方的圆形手柄；Shift 每 15°；双击归零。图片：Ctrl+V 粘贴截图。</li>
      <li>快捷键：Del 删除 · Ctrl+D 复制 · Ctrl+C/V · 方向键微调(Shift×10) · Ctrl+滚轮缩放 · Esc 取消选择 · 拖动时按 Alt 反转吸附</li>
    </ul>
  </details>
</template>

<!-- 核心 -->
<script src="js/core.js"></script>
<script>PD.edition = 'math';</script>
<!-- 素材库（数学版） -->
<script src="lib/basic.js"></script>
<script src="lib/graph.js"></script>
<script src="lib/solid3d.js"></script>
<script src="lib/mgeo.js"></script>
<script src="lib/mstat.js"></script>
<script src="js/app.js"></script>
</body>
</html>
